<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1920px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;
    background:radial-gradient(1200px 800px at 78% 45%, #1f3550 0%, rgba(31,53,80,0) 70%),
               linear-gradient(135deg,#0f1419 0%,#16232f 55%,#1a2b3d 100%);position:relative;color:#fff}
  .bar{position:absolute;left:0;top:0;width:14px;height:1080px;background:linear-gradient(#fbbf24,#f59e0b)}
  .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:40px 40px;
        -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%,#000 100%)}
  .left{position:absolute;left:150px;top:0;height:1080px;width:900px;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-family:'Inter Display','Inter';font-weight:700;font-size:28px;letter-spacing:5px;color:#fbbf24;text-transform:uppercase;margin-bottom:44px;display:flex;align-items:center;gap:18px}
  .kicker .num{border:2px solid #fbbf24;border-radius:999px;padding:4px 16px;letter-spacing:1px}
  h1{font-family:'Inter Display','Inter';font-weight:800;font-size:112px;line-height:1.0;letter-spacing:-3.5px;margin:0}
  h2{font-family:'Inter Display','Inter';font-weight:700;font-size:64px;line-height:1.1;letter-spacing:-1.5px;margin:34px 0 0;color:#fbbf24}
  .byline{position:absolute;left:150px;bottom:92px;font-size:26px;color:rgba(255,255,255,.72);font-weight:500;letter-spacing:.3px}
  .byline b{color:#fff;font-weight:700}
  svg{position:absolute;right:70px;top:150px}
</style></head>
<body>
<div class="grid"></div>
<div class="bar"></div>

<div class="left">
  <div class="kicker">Agentic Identity Notes <span class="num">#3</span></div>
  <h1>Four chairs.<br>One agent.</h1>
  <h2>How identity vendors<br>approach agent identity.</h2>
</div>

<div class="byline"><b>Santosh Prusty</b>&nbsp;&nbsp;·&nbsp;&nbsp;Identity governance for the enterprise and for AI agents</div>

<svg width="820" height="780" viewBox="0 0 820 780" xmlns="http://www.w3.org/2000/svg" font-family="Inter">
  <defs>
    <linearGradient id="amb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <g id="bot">
      <rect x="-26" y="-20" width="52" height="40" rx="12" fill="none" stroke="currentColor" stroke-width="4"/>
      <circle cx="-10" cy="0" r="5" fill="currentColor"/><circle cx="10" cy="0" r="5" fill="currentColor"/>
      <line x1="0" y1="-20" x2="0" y2="-31" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="-34" r="5" fill="currentColor"/>
    </g>
  </defs>

  <!-- connections from each seat to the agent -->
  <g stroke="rgba(251,191,36,.75)" stroke-width="3" fill="none" stroke-dasharray="10 8">
    <path d="M250 190 C 330 230, 350 300, 370 340"/>
    <path d="M570 190 C 490 230, 470 300, 450 340"/>
    <path d="M250 590 C 330 550, 350 480, 370 440"/>
    <path d="M570 590 C 490 550, 470 480, 450 440"/>
  </g>

  <!-- seats -->
  <g font-weight="700" text-anchor="middle">
    <g transform="translate(150,150)"><rect x="-120" y="-56" width="240" height="112" rx="18" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.28)" stroke-width="2"/>
      <text y="-8" font-size="28" fill="#fff">Directory</text><text y="28" font-size="20" font-weight="600" fill="#94a3b8">register it</text></g>
    <g transform="translate(670,150)"><rect x="-120" y="-56" width="240" height="112" rx="18" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.28)" stroke-width="2"/>
      <text y="-8" font-size="28" fill="#fff">Vault</text><text y="28" font-size="20" font-weight="600" fill="#94a3b8">strip standing access</text></g>
    <g transform="translate(150,630)"><rect x="-120" y="-56" width="240" height="112" rx="18" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.28)" stroke-width="2"/>
      <text y="-8" font-size="28" fill="#fff">Governance</text><text y="28" font-size="20" font-weight="600" fill="#94a3b8">find, own, certify</text></g>
    <g transform="translate(670,630)"><rect x="-120" y="-56" width="240" height="112" rx="18" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.28)" stroke-width="2"/>
      <text y="-8" font-size="28" fill="#fff">Gateway</text><text y="28" font-size="20" font-weight="600" fill="#94a3b8">delegate per token</text></g>
  </g>

  <!-- system of record ring -->
  <circle cx="410" cy="390" r="112" fill="none" stroke="rgba(148,163,184,.5)" stroke-width="2.5" stroke-dasharray="6 8"/>

  <!-- the agent -->
  <g color="#fbbf24" transform="translate(410,390)">
    <circle r="66" fill="rgba(251,191,36,.10)" stroke="url(#amb)" stroke-width="4"/><use href="#bot" y="6"/>
  </g>
  <text x="410" y="637" text-anchor="middle" font-size="20" font-weight="700" fill="#fbbf24" letter-spacing="2">SYSTEM OF RECORD?</text>
</svg>
</body></html>
