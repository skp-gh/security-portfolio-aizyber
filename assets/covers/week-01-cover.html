<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1920px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;
    background:radial-gradient(1200px 800px at 78% 45%, #1f3550 0%, rgba(31,53,80,0) 70%),
               linear-gradient(135deg,#0f1419 0%,#16232f 55%,#1a2b3d 100%);position:relative;color:#fff}
  .bar{position:absolute;left:0;top:0;width:14px;height:1080px;background:linear-gradient(#fbbf24,#f59e0b)}
  .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:40px 40px;
        -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%,#000 100%)}
  .left{position:absolute;left:150px;top:0;height:1080px;width:900px;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-family:'Inter Display','Inter';font-weight:700;font-size:28px;letter-spacing:5px;color:#fbbf24;text-transform:uppercase;margin-bottom:44px;display:flex;align-items:center;gap:18px}
  .kicker .num{border:2px solid #fbbf24;border-radius:999px;padding:4px 16px;letter-spacing:1px}
  h1{font-family:'Inter Display','Inter';font-weight:800;font-size:112px;line-height:1.0;letter-spacing:-3.5px;margin:0}
  h2{font-family:'Inter Display','Inter';font-weight:700;font-size:64px;line-height:1.1;letter-spacing:-1.5px;margin:34px 0 0;color:#fbbf24}
  .byline{position:absolute;left:150px;bottom:92px;font-size:26px;color:rgba(255,255,255,.72);font-weight:500;letter-spacing:.3px}
  .byline b{color:#fff;font-weight:700}
  svg{position:absolute;right:70px;top:150px}
</style></head>
<body>
<div class="grid"></div>
<div class="bar"></div>

<div class="left">
  <div class="kicker">Agentic Identity Notes <span class="num">#1</span></div>
  <h1>Nobody owns<br>your AI agents.</h1>
  <h2>That's the real problem.</h2>
</div>

<div class="byline"><b>Santosh Prusty</b>&nbsp;&nbsp;·&nbsp;&nbsp;Identity governance for the enterprise and for AI agents</div>

<svg width="820" height="780" viewBox="0 0 820 780" xmlns="http://www.w3.org/2000/svg" font-family="Inter">
  <defs>
    <linearGradient id="amb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <g id="bot">
      <rect x="-26" y="-20" width="52" height="40" rx="12" fill="none" stroke="currentColor" stroke-width="4"/>
      <circle cx="-10" cy="0" r="5" fill="currentColor"/><circle cx="10" cy="0" r="5" fill="currentColor"/>
      <line x1="0" y1="-20" x2="0" y2="-31" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="-34" r="5" fill="currentColor"/>
    </g>
    <g id="person">
      <circle cx="0" cy="-6" r="7" fill="#0f1419"/>
      <path d="M-12 12 a12 11 0 0 1 24 0 z" fill="#0f1419"/>
    </g>
  </defs>

  <!-- apps column -->
  <g font-size="22" font-weight="600" fill="#cbd5e1">
    <g transform="translate(640,120)"><rect x="-80" y="-34" width="200" height="68" rx="16" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.22)" stroke-width="2"/><text x="20" y="8" text-anchor="middle">CRM</text></g>
    <g transform="translate(640,290)"><rect x="-80" y="-34" width="200" height="68" rx="16" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.22)" stroke-width="2"/><text x="20" y="8" text-anchor="middle">Finance</text></g>
    <g transform="translate(640,460)"><rect x="-80" y="-34" width="200" height="68" rx="16" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.22)" stroke-width="2"/><text x="20" y="8" text-anchor="middle">Code repos</text></g>
    <g transform="translate(640,630)"><rect x="-80" y="-34" width="200" height="68" rx="16" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.22)" stroke-width="2"/><text x="20" y="8" text-anchor="middle">HR data</text></g>
  </g>

  <!-- connections -->
  <g stroke="rgba(148,163,184,.38)" stroke-width="2.5" fill="none">
    <path d="M150 110 C 360 110, 380 120, 560 120"/>
    <path d="M150 110 C 360 150, 380 280, 560 290"/>
    <path d="M330 230 C 450 230, 460 130, 560 120"/>
    <path d="M330 230 C 450 250, 470 450, 560 460"/>
    <path d="M150 360 C 360 360, 380 300, 560 290"/>
    <path d="M150 360 C 360 400, 400 620, 560 630"/>
    <path d="M330 500 C 450 500, 460 470, 560 460"/>
    <path d="M150 640 C 320 590, 420 600, 560 630"/>
    <path d="M330 500 C 450 520, 470 300, 560 290"/>
  </g>
  <g stroke="url(#amb)" stroke-width="3.5" fill="none">
    <path d="M330 690 C 450 690, 470 640, 560 630"/>
  </g>

  <!-- agents: unowned -->
  <g color="#94a3b8">
    <g transform="translate(110,110)"><circle r="58" fill="rgba(15,20,25,.85)" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/><use href="#bot" y="6"/>
      <g transform="translate(44,-44)"><circle r="20" fill="#1e293b" stroke="#64748b" stroke-width="3" stroke-dasharray="5 5"/><text y="9" text-anchor="middle" font-size="24" font-weight="800" fill="#cbd5e1">?</text></g></g>
    <g transform="translate(290,230)"><circle r="58" fill="rgba(15,20,25,.85)" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/><use href="#bot" y="6"/>
      <g transform="translate(44,-44)"><circle r="20" fill="#1e293b" stroke="#64748b" stroke-width="3" stroke-dasharray="5 5"/><text y="9" text-anchor="middle" font-size="24" font-weight="800" fill="#cbd5e1">?</text></g></g>
    <g transform="translate(110,360)"><circle r="58" fill="rgba(15,20,25,.85)" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/><use href="#bot" y="6"/>
      <g transform="translate(44,-44)"><circle r="20" fill="#1e293b" stroke="#64748b" stroke-width="3" stroke-dasharray="5 5"/><text y="9" text-anchor="middle" font-size="24" font-weight="800" fill="#cbd5e1">?</text></g></g>
    <g transform="translate(290,500)"><circle r="58" fill="rgba(15,20,25,.85)" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/><use href="#bot" y="6"/>
      <g transform="translate(44,-44)"><circle r="20" fill="#1e293b" stroke="#64748b" stroke-width="3" stroke-dasharray="5 5"/><text y="9" text-anchor="middle" font-size="24" font-weight="800" fill="#cbd5e1">?</text></g></g>
    <g transform="translate(110,640)"><circle r="58" fill="rgba(15,20,25,.85)" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/><use href="#bot" y="6"/>
      <g transform="translate(44,-44)"><circle r="20" fill="#1e293b" stroke="#64748b" stroke-width="3" stroke-dasharray="5 5"/><text y="9" text-anchor="middle" font-size="24" font-weight="800" fill="#cbd5e1">?</text></g></g>
  </g>

  <!-- agent: owned -->
  <g color="#fbbf24" transform="translate(290,690)">
    <circle r="58" fill="rgba(251,191,36,.10)" stroke="url(#amb)" stroke-width="4"/><use href="#bot" y="6"/>
    <g transform="translate(44,-44)"><circle r="20" fill="url(#amb)"/><use href="#person" y="1"/></g>
  </g>

  <!-- legend -->
  <g font-size="20" font-weight="600">
    <g transform="translate(40,762)"><circle r="9" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="4 4"/><text x="22" y="7" fill="#94a3b8">No owner</text></g>
    <g transform="translate(220,762)"><circle r="9" fill="url(#amb)"/><text x="22" y="7" fill="#fbbf24">Owned, scoped, expiring</text></g>
  </g>
</svg>
</body></html>
