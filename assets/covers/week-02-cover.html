<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1920px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;
    background:radial-gradient(1200px 800px at 78% 45%, #1f3550 0%, rgba(31,53,80,0) 70%),
               linear-gradient(135deg,#0f1419 0%,#16232f 55%,#1a2b3d 100%);position:relative;color:#fff}
  .bar{position:absolute;left:0;top:0;width:14px;height:1080px;background:linear-gradient(#fbbf24,#f59e0b)}
  .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:40px 40px;
        -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%,#000 100%)}
  .left{position:absolute;left:150px;top:0;height:1080px;width:900px;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-family:'Inter Display','Inter';font-weight:700;font-size:28px;letter-spacing:5px;color:#fbbf24;text-transform:uppercase;margin-bottom:44px;display:flex;align-items:center;gap:18px}
  .kicker .num{border:2px solid #fbbf24;border-radius:999px;padding:4px 16px;letter-spacing:1px}
  h1{font-family:'Inter Display','Inter';font-weight:800;font-size:112px;line-height:1.0;letter-spacing:-3.5px;margin:0}
  h2{font-family:'Inter Display','Inter';font-weight:700;font-size:64px;line-height:1.1;letter-spacing:-1.5px;margin:34px 0 0;color:#fbbf24}
  .byline{position:absolute;left:150px;bottom:92px;font-size:26px;color:rgba(255,255,255,.72);font-weight:500;letter-spacing:.3px}
  .byline b{color:#fff;font-weight:700}
  svg{position:absolute;right:70px;top:150px}
</style></head>
<body>
<div class="grid"></div>
<div class="bar"></div>

<div class="left">
  <div class="kicker">Agentic Identity Notes <span class="num">#2</span></div>
  <h1>The token<br>outlives<br>the click.</h1>
  <h2>Threat modeling the<br>OAuth "Allow" button.</h2>
</div>

<div class="byline"><b>Santosh Prusty</b>&nbsp;&nbsp;·&nbsp;&nbsp;Identity governance for the enterprise and for AI agents</div>

<svg width="820" height="780" viewBox="0 0 820 780" xmlns="http://www.w3.org/2000/svg" font-family="Inter">
  <defs>
    <linearGradient id="amb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <g id="bot">
      <rect x="-26" y="-20" width="52" height="40" rx="12" fill="none" stroke="currentColor" stroke-width="4"/>
      <circle cx="-10" cy="0" r="5" fill="currentColor"/><circle cx="10" cy="0" r="5" fill="currentColor"/>
      <line x1="0" y1="-20" x2="0" y2="-31" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="-34" r="5" fill="currentColor"/>
    </g>
    <g id="key">
      <circle cx="-8" cy="0" r="8" fill="none" stroke="#0f1419" stroke-width="4"/>
      <path d="M0 0 H14 M10 0 V7 M14 0 V6" stroke="#0f1419" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <!-- trust boundary: vendor cloud -->
  <rect x="300" y="190" width="250" height="400" rx="28" fill="rgba(255,255,255,.03)" stroke="rgba(148,163,184,.55)" stroke-width="2.5" stroke-dasharray="10 9"/>
  <text x="425" y="226" text-anchor="middle" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="2">VENDOR CLOUD</text>

  <!-- user -->
  <g transform="translate(90,390)">
    <circle r="58" fill="rgba(15,20,25,.85)" stroke="#94a3b8" stroke-width="3"/>
    <circle cy="-14" r="15" fill="#94a3b8"/><path d="M-26 30 a26 24 0 0 1 52 0 z" fill="#94a3b8"/>
    <text y="96" text-anchor="middle" font-size="20" font-weight="600" fill="#cbd5e1">User</text>
  </g>

  <!-- consent click -->
  <path d="M150 390 L 205 390" stroke="rgba(148,163,184,.6)" stroke-width="3"/>
  <g transform="translate(250,390)">
    <rect x="-46" y="-26" width="92" height="52" rx="12" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
    <text y="8" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Allow</text>
  </g>
  <path d="M296 390 L 365 390" stroke="#fbbf24" stroke-width="3.5"/>

  <!-- agent holding token -->
  <g color="#fbbf24" transform="translate(425,390)">
    <circle r="58" fill="rgba(251,191,36,.10)" stroke="url(#amb)" stroke-width="4"/><use href="#bot" y="6"/>
    <g transform="translate(46,-46)"><circle r="22" fill="url(#amb)"/><use href="#key" x="-2"/></g>
    <text y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#fbbf24">Refresh token</text>
  </g>

  <!-- apps -->
  <g stroke="url(#amb)" stroke-width="3.5" fill="none">
    <path d="M483 390 C 560 390, 560 170, 620 170"/>
    <path d="M483 390 C 560 390, 560 610, 620 610"/>
  </g>
  <path d="M483 390 L 620 390" stroke="#fbbf24" stroke-width="3.5"/>
  <g font-size="22" font-weight="600" fill="#cbd5e1">
    <g transform="translate(700,170)"><rect x="-80" y="-34" width="160" height="68" rx="16" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.22)" stroke-width="2"/><text y="8" text-anchor="middle">CRM</text></g>
    <g transform="translate(700,390)"><rect x="-80" y="-34" width="160" height="68" rx="16" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.22)" stroke-width="2"/><text y="8" text-anchor="middle">Mail</text></g>
    <g transform="translate(700,610)"><rect x="-80" y="-34" width="160" height="68" rx="16" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.22)" stroke-width="2"/><text y="8" text-anchor="middle">Files</text></g>
  </g>

  <!-- replayed token -->
  <g color="#94a3b8" transform="translate(425,690)">
    <circle r="50" fill="rgba(15,20,25,.85)" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/><use href="#bot" y="6"/>
    <g transform="translate(40,-40)"><circle r="18" fill="#1e293b" stroke="#64748b" stroke-width="3" stroke-dasharray="5 5"/><text y="8" text-anchor="middle" font-size="22" font-weight="800" fill="#cbd5e1">?</text></g>
  </g>
  <g stroke="rgba(148,163,184,.55)" stroke-width="2.5" fill="none" stroke-dasharray="8 8">
    <path d="M475 690 C 560 690, 580 640, 620 625"/>
  </g>
  <text x="300" y="760" font-size="20" font-weight="600" fill="#94a3b8">Same token, replayed from anywhere</text>

  <!-- STRIDE badges -->
  <g font-size="18" font-weight="800" text-anchor="middle">
    <g transform="translate(250,330)"><circle r="18" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text y="6" fill="#fbbf24">S</text></g>
    <g transform="translate(590,290)"><circle r="18" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text y="6" fill="#fbbf24">E</text></g>
    <g transform="translate(590,500)"><circle r="18" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text y="6" fill="#fbbf24">I</text></g>
    <g transform="translate(700,90)"><circle r="18" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text y="6" fill="#fbbf24">R</text></g>
  </g>
</svg>
</body></html>
